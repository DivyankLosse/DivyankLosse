name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#7FA8D6&color_dots=#FFF7D6,#FFF2B2,#FFE08A,#A8C6E7,#7FA8D6
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFE08A&color_dots=#161b22,#1f2f45,#3a5172,#7FA8D6,#FFE08A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
